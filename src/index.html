<!DOCTYPE html>
<html>
	<head>
	</head>
	<body>
        <div class="left">
                <div class="container">
                    <div class="background">
                        <div class="banner">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>fountain-pen-tip</title><path d="M15.54,3.5L20.5,8.47L19.07,9.88L14.12,4.93L15.54,3.5M3.5,19.78L10,13.31C9.9,13 9.97,12.61 10.23,12.35C10.62,11.96 11.26,11.96 11.65,12.35C12.04,12.75 12.04,13.38 11.65,13.77C11.39,14.03 11,14.1 10.69,14L4.22,20.5L14.83,16.95L18.36,10.59L13.42,5.64L7.05,9.17L3.5,19.78Z" /></svg> 
                            <p class="blogpoint">BlogPoint</p>
                        </div>
                    </div>
                </div>
        </div>
        <div class="right">
            
            <form>
                <fieldset class="form_inputs">
                    <div class="header">Sign Up</div>

                        <div class="details">
                            <input class="input" id="first_name" class = "first_name" placeholder="First Name"  type="text" required>
                        </div>
                        <div class="details">
                            <input class="input" placeholder="Last Name" name="last_name" type="text" required>
                        </div>
                        <div class="details">
                            <input class="input" placeholder="Email" id="email" name="email" type="email" required>
                        </div>
                        <div class="details">
                            <input class="input" placeholder="Phone Number" id="phone_number" name="phone_number" type="text" minlength="10" maxlength="10" pattern="^[0-9]+$" required>
                        </div>
                        <div class="details">
                            <input class="input password1" placeholder="Password" id="password" name="password" type="password" required>
                        </div>
                        <div class="details">
                            <input class="input password2" placeholder="Confirm Password" id="confirm_password" name="confirm_password" type="password" required>
                        </div>

                </fieldset>
                <button type="submit" class="submit">Create account</button>
            </form>

            <p>Already have an account? <a>Log in.</a></p>
        </div>
	</body>
</html>
